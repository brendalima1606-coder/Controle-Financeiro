<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161F">
<title>MinhaGrana — Controle Financeiro + Livro de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23B8862F'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --sidebar:#12161F; --sidebarSoft:#1A202C; --paper:#0F1319; --card:#181D27;
    --ink:#D9DEE8; --inkSoft:#8A93A6; --rule:#262D3A; --gold:#D2A360; --goldSoft:rgba(210,163,96,.13);
    --teal:#4FB6C4; --tealSoft:rgba(79,182,196,.13); --green:#5CB894; --greenSoft:rgba(92,184,148,.13);
    --red:#D9776E; --redSoft:rgba(217,119,110,.13); --accent:#5B92E0; --accentSoft:rgba(91,146,224,.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  .serif{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  input,select{font-family:'Inter',sans-serif;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px;}

  #app{display:flex;flex-direction:column;min-height:100vh;max-width:960px;margin:0 auto;background:var(--paper);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--sidebar);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{width:34px;height:34px;border-radius:8px;background:var(--sidebarSoft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-shrink:0;}
  .brand-name{color:#fff;font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;display:block;}
  .brand-sub{color:var(--inkSoft);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;margin-top:1px;}

  .tabs{display:flex;gap:4px;background:var(--sidebarSoft);border:1px solid var(--rule);border-radius:10px;padding:3px;overflow-x:auto;}
  .tab-btn{border:none;background:none;color:var(--inkSoft);padding:7px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;text-transform:uppercase;}
  .tab-btn.active{background:var(--accent);color:#fff;}

  .month-nav{display:flex;align-items:center;gap:2px;background:var(--sidebarSoft);border:1px solid var(--rule);border-radius:10px;padding:4px 6px;}
  .month-nav button{border:none;background:none;cursor:pointer;padding:5px 4px;color:var(--ink);font-size:14px;flex-shrink:0;}
  .month-nav select{border:none;background:none;font-weight:600;font-size:12px;padding:0 4px;color:var(--ink);font-family:'IBM Plex Mono',monospace;max-width:88px;}
  .month-nav select option{background:var(--card);color:var(--ink);}

  .content{padding:18px 16px 90px;}

  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--inkSoft);text-transform:uppercase;margin:22px 0 10px;}
  .section-label:first-child{margin-top:0;}

  .banner{display:flex;align-items:center;justify-content:space-between;background:var(--goldSoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:12.5px;color:var(--gold);gap:8px;flex-wrap:wrap;}
  .banner a{background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--gold);font-weight:600;font-size:12.5px;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px;}
  @media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr);}}
  .card{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:13px 14px;}
  .card:nth-child(4n+1){border-left-color:var(--green);}
  .card:nth-child(4n+2){border-left-color:var(--gold);}
  .card:nth-child(4n+3){border-left-color:var(--teal);}
  .card:nth-child(4n+4){border-left-color:var(--accent);}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .card-label{font-size:10px;color:var(--inkSoft);text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;}
  .card-value{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .card-sub{font-size:10.5px;color:var(--inkSoft);margin-top:4px;}

  .grid2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.grid2{grid-template-columns:1.15fr 1fr;}}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;margin-bottom:12px;}
  .panel h3{font-size:12px;font-weight:700;margin:0 0 14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);}
  .panel p.sub{font-size:12px;color:var(--inkSoft);margin:-10px 0 14px;}

  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;}
  .legend-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;}
  .legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:8px;}

  .bar-row{margin-bottom:11px;cursor:default;}
  .bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;align-items:baseline;gap:6px;}
  .bar-top .cat-name{display:flex;align-items:center;gap:6px;}
  .bar-track{height:7px;border-radius:4px;background:var(--paper);overflow:hidden;position:relative;border:1px solid var(--rule);}
  .bar-fill{height:100%;border-radius:4px;transition:width .2s;}
  .bar-limit-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);}
  .over-budget{color:var(--red)!important;font-weight:700;}

  .tip-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;}
  .tip{border-radius:6px;padding:9px 12px;font-size:12.5px;line-height:1.45;margin-bottom:7px;border:1px solid transparent;}
  .tip.good{background:var(--greenSoft);color:var(--green);border-color:rgba(52,211,153,.25);}
  .tip.bad{background:var(--redSoft);color:var(--red);border-color:rgba(240,102,90,.25);}

  .ledger-head,.ledger-row{display:grid;grid-template-columns:22px 44px 1fr 72px 78px;gap:6px;align-items:center;font-size:12.5px;padding:9px 2px;cursor:pointer;}
  @media(min-width:600px){.ledger-head,.ledger-row{grid-template-columns:22px 58px 1fr 100px 90px 90px 30px 30px;}}
  .ledger-head{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkSoft);border-bottom:1px solid var(--rule);cursor:default;font-family:'IBM Plex Mono',monospace;}
  .ledger-row{border-bottom:1px solid var(--rule);}
  .ledger-row:active{background:var(--sidebarSoft);}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:5px;text-align:center;width:fit-content;display:inline-block;font-family:'IBM Plex Mono',monospace;}
  .pill.fixo{background:var(--goldSoft);color:var(--gold);}
  .pill.variavel{background:var(--tealSoft);color:var(--teal);}
  .pill.recorrente{background:var(--accentSoft);color:var(--accent);margin-left:4px;}
  .cat-cell{display:none;}
  @media(min-width:600px){.cat-cell{display:block;font-size:11px;color:var(--inkSoft);}}
  .del-btn{border:none;background:none;cursor:pointer;color:var(--red);font-size:15px;display:none;}
  @media(min-width:600px){.del-btn{display:block;}}
  .dup-btn{border:none;background:none;cursor:pointer;color:var(--accent);font-size:14px;display:none;}
  @media(min-width:600px){.dup-btn{display:block;}}

  .fab{position:fixed;bottom:22px;right:22px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px 20px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px;z-index:20;font-family:'IBM Plex Mono',monospace;}

  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:400px;border:1px solid var(--rule);max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .close-btn{border:none;background:none;cursor:pointer;color:var(--inkSoft);font-size:20px;line-height:1;}
  .seg{display:flex;gap:8px;margin-bottom:12px;}
  .seg button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
  .seg button.active{border-color:var(--accent);background:var(--accent);color:#fff;}
  .seg button.nat.active{border-color:var(--gold);background:var(--goldSoft);color:var(--gold);}
  label.field-label{font-size:11px;color:var(--inkSoft);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace;}
  .field{width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--rule);margin-bottom:12px;font-size:13px;background:var(--sidebarSoft);color:var(--ink);}
  .two-col{display:flex;gap:10px;}
  .two-col>div{flex:1;}
  .submit-btn{width:100%;padding:11px 0;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-family:'IBM Plex Mono',monospace;}
  .danger-btn{width:100%;padding:11px 0;border-radius:8px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
  .secondary-btn{width:100%;padding:11px 0;border-radius:8px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:14px;color:var(--inkSoft);}

  .empty{font-size:13px;color:var(--inkSoft);padding:20px 4px;}
  .save-error{margin-top:14px;font-size:12px;color:var(--red);}

  /* Settings sub-tabs */
  .subtabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--rule);}
  .subtab-btn{border:none;background:none;padding:9px 4px;margin-right:14px;font-size:12px;font-weight:600;color:var(--inkSoft);cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.03em;font-family:'IBM Plex Mono',monospace;}
  .subtab-btn.active{color:var(--ink);border-bottom-color:var(--accent);}

  .budget-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);}
  .budget-item .bname{font-size:13px;display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;overflow-wrap:break-word;}
  .budget-item input{width:110px;flex-shrink:0;padding:7px 10px;border-radius:7px;border:1px solid var(--rule);font-size:12.5px;text-align:right;background:var(--sidebarSoft);color:var(--ink);}

  .rec-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);}
  .rec-info{font-size:13px;flex:1 1 auto;min-width:0;overflow-wrap:break-word;}
  .rec-info .rec-meta{font-size:11px;color:var(--inkSoft);margin-top:2px;}
  .rec-value{font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .icon-btn{border:none;background:none;cursor:pointer;color:var(--inkSoft);font-size:16px;padding:4px;}

  .save-btn-small{padding:8px 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;margin-top:10px;text-transform:uppercase;letter-spacing:.03em;font-family:'IBM Plex Mono',monospace;}
  .save-flash{font-size:11.5px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .2s;}
  .save-flash.show{opacity:1;}

  /* History chart */
  .hist-chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 4px 0;overflow-x:auto;}
  .hist-col{display:flex;flex-direction:column;align-items:center;min-width:52px;flex-shrink:0;}
  .hist-bars{display:flex;align-items:flex-end;gap:4px;height:130px;}
  .hist-bar{width:14px;border-radius:3px 3px 0 0;}
  .hist-label{font-size:10.5px;color:var(--inkSoft);margin-top:6px;text-align:center;}
  .hist-balance{font-size:10px;font-weight:700;margin-top:2px;}

  .hist-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px;}
  .hist-table th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--inkSoft);padding:6px 4px;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;}
  .hist-table th:first-child,.hist-table td:first-child{text-align:left;}
  .hist-table td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;}

  /* Projeção anual */
  .proj-value{font-size:32px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .proj-meta{font-size:12px;color:var(--inkSoft);margin-top:6px;}
  .year-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;}
  .year-dot{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:#fff;cursor:default;}
  .year-dot.empty{background:var(--sidebarSoft);color:var(--inkSoft);border:1px dashed var(--rule);}
  .year-dot.pos{background:var(--green);}
  .year-dot.neg{background:var(--red);}
  .year-dot.proj-pos{background:var(--greenSoft);color:var(--green);border:1px dashed var(--green);}
  .year-dot.proj-neg{background:var(--redSoft);color:var(--red);border:1px dashed var(--red);}

  /* Relatório */
  .report-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .report-period{display:flex;gap:4px;background:var(--sidebarSoft);border:1px solid var(--rule);border-radius:10px;padding:3px;}
  .report-period button{border:none;background:none;color:var(--inkSoft);padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.02em;}
  .report-period button.active{background:var(--accent);color:#fff;}
  .report-actions{display:flex;gap:8px;}
  .report-actions button{border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px;}
  .report-actions button:hover{border-color:var(--accent);}
  #report-print-area{background:#fff;color:#111;border-radius:10px;padding:28px;}
  #report-print-area h2{font-family:'IBM Plex Mono',monospace;font-size:18px;margin:0 0 2px;color:#111;}
  #report-print-area .rep-sub{font-size:12px;color:#555;margin-bottom:20px;}
  #report-print-area .rep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  #report-print-area .rep-card{border:1px solid #ddd;border-radius:8px;padding:10px 12px;}
  #report-print-area .rep-card .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#777;font-family:'IBM Plex Mono',monospace;}
  #report-print-area .rep-card .v{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-top:3px;}
  #report-print-area h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #111;padding-bottom:6px;margin:26px 0 10px;font-family:'IBM Plex Mono',monospace;}
  #report-print-area table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;}
  #report-print-area th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#666;padding:6px 4px;border-bottom:1px solid #999;font-family:'IBM Plex Mono',monospace;}
  #report-print-area td{padding:6px 4px;border-bottom:1px solid #e5e5e5;font-family:'IBM Plex Mono',monospace;}
  #report-print-area td.num,#report-print-area th.num{text-align:right;}
  #report-print-area tfoot td{font-weight:700;border-top:2px solid #111;border-bottom:none;}
  #report-print-area .rep-footer{margin-top:24px;font-size:10.5px;color:#888;text-align:right;}
  @media print{
    body *{visibility:hidden;}
    #report-print-area, #report-print-area *{visibility:visible;}
    #report-print-area{position:absolute;left:0;top:0;width:100%;padding:0;border-radius:0;}
    .report-toolbar, .fab{display:none!important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOKENS = {gold:'#D2A360',teal:'#4FB6C4',green:'#5CB894',red:'#D9776E',ink:'#D9DEE8',accent:'#5B92E0'};
const EXPENSE_CATEGORIES = ['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Cartão de Crédito','Outros'];
const INCOME_CATEGORIES = ['Salário','Freelance','Investimentos','Outros'];
const CATEGORY_COLORS = {'Moradia':'#D2A360','Alimentação':'#D9776E','Transporte':'#6B9FDB','Saúde':'#5CB894','Educação':'#A594D6','Lazer':'#D69A66','Assinaturas':'#CB7FA0','Cartão de Crédito':'#8A93A6','Outros':'#96A0B2','Salário':'#5CB894','Freelance':'#D2A360','Investimentos':'#4FB6C4'};
const CATEGORY_ICONS = {'Moradia':'🏠','Alimentação':'🍽️','Transporte':'🚗','Saúde':'💊','Educação':'📚','Lazer':'🎉','Assinaturas':'🔁','Cartão de Crédito':'💳','Outros':'📦','Salário':'💰','Freelance':'🧾','Investimentos':'📈'};
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTH_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const STORAGE_KEY = 'minhagrana-data';

// Categorias personalizadas (do "Livro de Gastos") e helpers de categoria
function expCats(){ return [...EXPENSE_CATEGORIES, ...(state.customCategories.despesa||[])]; }
function incCats(){ return [...INCOME_CATEGORIES, ...(state.customCategories.receita||[])]; }
function catsFor(type){ return type==='receita' ? incCats() : expCats(); }

const fmt = n => (n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');

function seedData(){
  const now = new Date();
  const ym = `${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  return [
    {id:'s1',date:`${ym}-01`,desc:'Salário',value:4800,type:'receita',nature:'fixo',category:'Salário'},
    {id:'s2',date:`${ym}-03`,desc:'Aluguel',value:1500,type:'despesa',nature:'fixo',category:'Moradia'},
    {id:'s3',date:`${ym}-05`,desc:'Internet + luz + água',value:420,type:'despesa',nature:'fixo',category:'Moradia'},
    {id:'s4',date:`${ym}-06`,desc:'Academia',value:120,type:'despesa',nature:'fixo',category:'Saúde'},
    {id:'s5',date:`${ym}-07`,desc:'Streamings',value:95,type:'despesa',nature:'fixo',category:'Assinaturas'},
    {id:'s6',date:`${ym}-10`,desc:'Supermercado',value:680,type:'despesa',nature:'variavel',category:'Alimentação'},
    {id:'s7',date:`${ym}-12`,desc:'Uber da semana',value:210,type:'despesa',nature:'variavel',category:'Transporte'},
    {id:'s8',date:`${ym}-15`,desc:'Freelance de design',value:900,type:'receita',nature:'variavel',category:'Freelance'},
    {id:'s9',date:`${ym}-18`,desc:'Restaurante com amigos',value:260,type:'despesa',nature:'variavel',category:'Lazer'},
    {id:'s10',date:`${ym}-22`,desc:'Fatura do cartão',value:540,type:'despesa',nature:'variavel',category:'Cartão de Crédito'},
    {id:'s11',date:`${ym}-25`,desc:'Curso online',value:180,type:'despesa',nature:'variavel',category:'Educação'},
  ];

async function persistAll(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      transactions: state.transactions,
      recurring: state.recurring,
      budgets: state.budgets,
      salary: state.salary,
      skips: state.skips,
      notes: state.notes,
      customCategories: state.customCategories
    }));
    state.saveError = false;
  }catch(e){
    state.saveError = true;
    console.error('Storage error:', e);
  }
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const result = raw ? {value: raw} : null;
    if(result && result.value){
      const data = JSON.parse(result.value);
      state.transactions = data.transactions || [];
      state.recurring = data.recurring || [];
      state.budgets = data.budgets || {};
      state.salary = data.salary || {};
      state.skips = data.skips || [];
      state.notes = data.notes || {};
      state.customCategories = data.customCategories || {despesa:[], receita:[]};
      if(!state.transactions.length && !state.recurring.length){
        const seed = seedData();
        state.transactions = seed;
        state.isExample = true;
        await persistAll();
      }
    } else {
      const seed = seedData();
      state.transactions = seed;
      state.isExample = true;
      await persistAll();
    }
  }catch(e){
    // Key doesn't exist yet or another storage error: seed with examples
    const seed = seedData();
    state.transactions = seed;
    state.isExample = true;
    try{ await persistAll(); }catch(e2){ state.saveError = true; }
  }
}

function persistTx(next){
  state.transactions = next;
  persistAll();
}
function persistRec(){ persistAll(); }
function persistBudgets(){ persistAll(); }
function persistSkips(){ persistAll(); }

function ensureRecurringForMonth(ym){
  if(!state.recurring.length) return;
  let changed = false;
  const next = [...state.transactions];
  state.recurring.forEach(r=>{
    const skipKey = `${r.id}::${ym}`;
    if(state.skips.includes(skipKey)) return;
    const exists = next.some(t=>t.recurringId===r.id && t.date.slice(0,7)===ym);
    if(!exists){
      const [y,m] = ym.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      const day = Math.min(parseInt(r.day)||1, lastDay);
      next.push({id:'tx-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), date:`${ym}-${pad2(day)}`, desc:r.desc, value:r.value, type:r.type, nature:r.nature, category:r.category, recurringId:r.id});
      changed = true;
    }
  });
  if(changed) persistTx(next);
}

function computeMonthTx(){
  return state.transactions.filter(t=>t.date.slice(0,7)===state.month).sort((a,b)=>a.date.localeCompare(b.date));
}

function computeStatsFor(monthTx){
  let income=0, fixedExp=0, varExp=0; const byCategory={};
  monthTx.forEach(t=>{
    if(t.type==='receita') income+=t.value;
    else{
      if(t.nature==='fixo') fixedExp+=t.value; else varExp+=t.value;
      byCategory[t.category]=(byCategory[t.category]||0)+t.value;
    }
  });
  const totalExp = fixedExp+varExp;
  const balance = income-totalExp;
  return {income,fixedExp,varExp,totalExp,balance,byCategory};
}

function computeTips(stats){
  const good=[], bad=[];
  const {income,fixedExp,varExp,totalExp,balance,byCategory}=stats;
  if(income>0){
    const fixedRatio=fixedExp/income, savingsRate=balance/income;
    if(fixedRatio>0.5) bad.push(`Gastos fixos consomem ${(fixedRatio*100).toFixed(0)}% da sua renda — acima da faixa recomendada de até 50%. Vale revisar contratos, assinaturas e moradia.`);
    else if(fixedRatio<=0.35) good.push(`Gastos fixos representam só ${(fixedRatio*100).toFixed(0)}% da renda, o que te dá bastante margem de manobra no mês.`);
    if(balance<0) bad.push(`O mês fechou no vermelho: ${fmt(balance)}. As despesas superaram a receita — priorize cortar gastos variáveis primeiro.`);
    else if(savingsRate>=0.2) good.push(`Você guardou ${(savingsRate*100).toFixed(0)}% da renda este mês, batendo a meta clássica de poupar ao menos 20%.`);
    else if(savingsRate>=0) bad.push(`A sobra do mês foi de apenas ${(savingsRate*100).toFixed(0)}% da renda — uma margem apertada para imprevistos.`);
    if(varExp>fixedExp && totalExp>0) bad.push(`Os gastos variáveis (${fmt(varExp)}) superaram os fixos (${fmt(fixedExp)}), sinal de que o dia a dia está pesando mais que os compromissos fixos.`);
  }
  const catEntries = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length && totalExp>0){
    const [topCat, topVal] = catEntries[0];
    const share = topVal/totalExp;
    if(share>0.35) bad.push(`"${topCat}" concentra ${(share*100).toFixed(0)}% de tudo que você gastou no mês — vale olhar com mais atenção essa categoria.`);
  }
  Object.entries(state.budgets).forEach(([cat,limit])=>{
    const lim = parseFloat(limit);
    if(lim>0 && byCategory[cat]>lim){
      bad.push(`Você passou da meta em "${cat}": gastou ${fmt(byCategory[cat])} de um limite de ${fmt(lim)}.`);
    }
  });
  const assinaturas = byCategory['Assinaturas'];
  if(assinaturas && income>0 && assinaturas/income>0.05) bad.push(`Assinaturas somam ${fmt(assinaturas)}, mais de 5% da renda. Bom momento para revisar o que ainda vale a pena manter.`);
  if(fixedExp>0 && income>0 && fixedExp/income<=0.5 && catEntries.length>=4) good.push(`Seus gastos estão distribuídos entre ${catEntries.length} categorias diferentes, sem depender de uma única fonte de despesa.`);
  if(good.length===0) good.push('Ainda não há dados suficientes neste mês para apontar pontos fortes — registre mais lançamentos.');
  if(bad.length===0) bad.push('Nenhum ponto de atenção identificado neste mês — continue assim.');
  return {good:good.slice(0,4), bad:bad.slice(0,4)};
}

function buildReportData(period){
  const [yy, mm] = state.month.split('-').map(Number);
  let txs, label;
  if(period==='ano'){
    txs = state.transactions.filter(t=>t.date.slice(0,4)===String(yy));
    label = `Ano de ${yy}`;
  } else if(period==='tudo'){
    txs = state.transactions.slice();
    label = 'Todo o período registrado';
  } else {
    txs = state.transactions.filter(t=>t.date.slice(0,7)===state.month);
    label = `${MONTH_NAMES[mm-1]} de ${yy}`;
  }
  txs = txs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const stats = computeStatsFor(txs);
  const catEntries = Object.entries(stats.byCategory).sort((a,b)=>b[1]-a[1]);
  return {label, txs, stats, catEntries};
}

// Encontra, entre as transações, as que pertencem à "mesma série" de um
// lançamento fixo (mesmo recorrente vinculado, ou mesma descrição+categoria+tipo
// quando não há vínculo de recorrência — caso de itens fixos criados manualmente
// ou via "Replicar para outros meses").
function findFixedSeries(original){
  return state.transactions.filter(t=>{
    if(t.id===original.id) return false;
    if(original.recurringId) return t.recurringId===original.recurringId;
    return !t.recurringId && t.nature==='fixo' && t.type===original.type &&
      t.desc.trim().toLowerCase()===original.desc.trim().toLowerCase() &&
      t.category===original.category;
  });
}

function submitForm(){
  const f = state.form;
  if(!f.desc.trim() || !f.value || isNaN(parseFloat(f.value))) return;
  const newVal = Math.abs(parseFloat(f.value));
  state.cascadeCount = 0;
  if(state.editingId){
    const original = state.transactions.find(t=>t.id===state.editingId);
    const editedDate = f.date || (original?original.date:`${state.month}-01`);
    let next = state.transactions.map(t=> t.id===state.editingId ? {...t, date:editedDate, desc:f.desc.trim(), value:newVal, type:f.type, nature:f.nature, category:f.category} : t);

    // Espelha a alteração de um lançamento fixo para todos os meses
    // posteriores que já têm essa mesma conta fixa preenchida.
    if(original && original.nature==='fixo' && f.nature==='fixo'){
      const editedYm = editedDate.slice(0,7);
      const newDay = parseInt(editedDate.slice(8,10),10) || parseInt(original.date.slice(8,10),10) || 1;
      const series = findFixedSeries(original).filter(t=>t.date.slice(0,7) > editedYm);
      const seriesIds = new Set(series.map(t=>t.id));
      state.cascadeCount = series.length;
      next = next.map(t=>{
        if(!seriesIds.has(t.id)) return t;
        const [y,m] = t.date.slice(0,7).split('-').map(Number);
        const lastDay = new Date(y, m, 0).getDate();
        const day = Math.min(newDay, lastDay);
        return {...t, date:`${t.date.slice(0,7)}-${pad2(day)}`, desc:f.desc.trim(), value:newVal, type:f.type, nature:f.nature, category:f.category};
      });

      // Mantém a definição de recorrência em sincronia, para que os
      // próximos meses gerados automaticamente já saiam com os novos dados.
      if(original.recurringId){
        state.recurring = state.recurring.map(r=> r.id===original.recurringId
          ? {...r, desc:f.desc.trim(), value:newVal, type:f.type, nature:f.nature, category:f.category, day:Math.max(1,Math.min(28,newDay))}
          : r);
        persistRec();
      }
    }
    persistTx(next);
  } else {
    const next = [...state.transactions, {
      id:'tx-'+Date.now(), date:f.date||`${state.month}-01`, desc:f.desc.trim(),
      value:newVal, type:f.type, nature:f.nature, category:f.category,
    }];
    persistTx(next);
  }
  state.isExample = false;
  state.showForm = false;
  state.editingId = null;
  render();
  if(state.cascadeCount>0){
    state.cascadeFlash = true;
    render();
    setTimeout(()=>{ state.cascadeFlash=false; render(); }, 2600);
  }
}

function deleteFromForm(){

}

// ---- Replicar para outros meses ----
function getReplicateMonthOptions(baseYM){
  const [y,m] = baseYM.split('-').map(Number);
  const arr=[];
  for(let i=1;i<=12;i++){
    const d = new Date(y, m-1+i, 1);
    arr.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`);
  }
  return arr;
}
function openReplicateForm(idOrIds){
  const ids = Array.isArray(idOrIds) ? idOrIds : [idOrIds];
  const txs = ids.map(id=>state.transactions.find(t=>t.id===id)).filter(Boolean);
  if(!txs.length) return;
  state.replicateForIds = ids;
  state.replicateSelected = {};
  state.showReplicateForm = true;
  render();
}
function submitReplicate(){
  const txs = (state.replicateForIds||[]).map(id=>state.transactions.find(t=>t.id===id)).filter(Boolean);
  if(!txs.length) return;
  const months = Object.keys(state.replicateSelected).filter(k=>state.replicateSelected[k]);
  if(!months.length) return;
  const next = [...state.transactions];
  txs.forEach(tx=>{
    months.forEach(ym=>{
      const [y,m] = ym.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      const day = Math.min(parseInt(tx.date.slice(8,10))||1, lastDay);
      next.push({id:'tx-'+Date.now()+'-'+Math.random().toString(36).slice(2,9), date:`${ym}-${pad2(day)}`, desc:tx.desc, value:tx.value, type:tx.type, nature:tx.nature, category:tx.category});
    });
  });
  persistTx(next);
  state.isExample = false;
  state.showReplicateForm = false;
  state.replicateForIds = null;
  state.selectedTxIds = [];
  render();
}

function removeTx(id){
  const tx = state.transactions.find(t=>t.id===id);
  if(tx && tx.recurringId){
    const skipKey = `${tx.recurringId}::${tx.date.slice(0,7)}`;
    if(!state.skips.includes(skipKey)){ state.skips.push(skipKey); persistSkips(); }
  }
  persistTx(state.transactions.filter(t=>t.id!==id));
  state.selectedTxIds = state.selectedTxIds.filter(x=>x!==id);
  render();
}
function clearExamples(){ persistTx([]); state.isExample=false; render(); }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const exists = catsFor(type).some(c=>c.toLowerCase()===name.toLowerCase());
  if(exists){ state.newCatError = 'Essa categoria já existe.'; render(); return; }
  if(!state.customCategories[type]) state.customCategories[type] = [];
  state.customCategories[type].push(name);

// ---- Salário / holerite ----
function getSalaryFor(ym){
  return state.salary[ym] || {};
}

function computeSalaryStats(ym){
  const s = getSalaryFor(ym);
  const base = parseFloat(s.base)||0;
  const extras = parseFloat(s.extras)||0;
  const noturno = parseFloat(s.noturno)||0;
  const dsr = parseFloat(s.dsr)||0;
  const inss = parseFloat(s.inss)||0;
  const irrf = parseFloat(s.irrf)||0;
  const outros = parseFloat(s.outros)||0;
  const bruto = base+extras+noturno+dsr;
  const descontos = inss+irrf+outros;
  const liquido = bruto-descontos;
  return {base,extras,noturno,dsr,inss,irrf,outros,bruto,descontos,liquido};
}

function saveSalary(){
  const fields = ['base','extras','noturno','dsr','inss','irrf','outros'];
  const entry = {...(state.salary[state.month]||{})};
  let anyFilled = false;
  fields.forEach(f=>{
    const el = document.getElementById('sal-'+f);
    if(el){
      const v = el.value.trim();
      if(v==='') delete entry[f]; else { entry[f]=v; anyFilled=true; }
    }
  });
  if(anyFilled) state.salary[state.month] = entry;
  else delete state.salary[state.month];
  persistAll();
  state.salaryFlash = true;
  render();
  setTimeout(()=>{ state.salaryFlash=false; const f=document.getElementById('salary-flash'); if(f) f.classList.remove('show'); }, 1800);
}

// ---- Projeção anual ----
// Soma o saldo real dos meses já preenchidos e, para os meses que ainda faltam
// (depois do último mês com lançamentos), projeta repetindo os números desse
// último mês preenchido — assim dá pra saber se o ano deve fechar no azul ou
// no vermelho, e não só o que já aconteceu.
function computeYearProjection(year){
  const monthsData = [];
  for(let m=1;m<=12;m++){
    const ym = `${year}-${pad2(m)}`;
    const tx = state.transactions.filter(t=>t.date.slice(0,7)===ym);
    if(!tx.length){ monthsData.push({ym, m, filled:false}); continue; }
    const s = computeStatsFor(tx);
    monthsData.push({ym, m, filled:true, ...s});
  }

  const filledMonths = monthsData.filter(md=>md.filled);
  const filledCount = filledMonths.length;
  const actualIncome = filledMonths.reduce((sum,md)=>sum+md.income,0);
  const actualExpense = filledMonths.reduce((sum,md)=>sum+md.totalExp,0);
  const actualBalance = actualIncome-actualExpense;

  // Último mês (o mais recente do ano) que tem lançamentos.
  let lastFilled = null;
  for(let m=12;m>=1;m--){
    const md = monthsData.find(d=>d.m===m && d.filled);
    if(md){ lastFilled = md; break; }
  }

  // Meses depois do último preenchido, ainda sem lançamentos: projeta usando
  // o padrão (receita/despesa) desse último mês preenchido.
  let projectedIncome=0, projectedExpense=0, projectedMonthsCount=0;
  if(lastFilled){
    monthsData.forEach(md=>{
      if(md.m>lastFilled.m && !md.filled){
        projectedIncome += lastFilled.income;
        projectedExpense += lastFilled.totalExp;
        projectedMonthsCount++;
        md.projectedBalance = lastFilled.balance;
      }
    });
  }

  // Se dezembro já está preenchido, não há mais nada a projetar: o valor final
  // do ano é o saldo do próprio mês de dezembro (que já reflete o que sobrou/faltou
  // pagar naquele mês), e não a soma de todos os meses preenchidos do ano.
  let totalIncome, totalExpense, totalBalance;
  if(lastFilled && lastFilled.m===12){
    totalIncome = lastFilled.income;
    totalExpense = lastFilled.totalExp;
    totalBalance = lastFilled.balance;
  } else {
    totalIncome = actualIncome+projectedIncome;
    totalExpense = actualExpense+projectedExpense;
    totalBalance = totalIncome-totalExpense;
  }

  return {
    monthsData, filledCount, lastFilled,
    actualIncome, actualExpense, actualBalance,
    projectedIncome, projectedExpense, projectedMonthsCount,
    totalIncome, totalExpense, totalBalance
  };
}

// ---- History ----
function getLastMonths(n){
  const arr=[];
  const [cy,cm] = state.month.split('-').map(Number);
  for(let i=n-1;i>=0;i--){
    const d = new Date(cy, cm-1-i, 1);
    arr.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`);
  }
  return arr;
}

        <button class="submit-btn" id="submit-form-btn">${state.editingId?'Salvar alterações':'Adicionar lançamento'}</button>

        ${(()=>{
          const txs = (state.replicateForIds||[]).map(id=>state.transactions.find(t=>t.id===id)).filter(Boolean);
          if(!txs.length) return '<div class="empty">Lançamento não encontrado.</div>';
          const months = getReplicateMonthOptions(state.month);
          const totalValue = txs.reduce((s,t)=>s+t.value,0);
          return `
            <p class="sub" style="margin-top:-6px;">${
              txs.length===1
                ? `Escolha para quais meses copiar <strong>${esc(txs[0].desc)}</strong> — ${fmt(txs[0].value)} · ${txs[0].nature==='fixo'?'Fixo':'Variável'}.`

  // Wire up events

  if(reportPrintBtn) reportPrintBtn.onclick = ()=>window.print();
  const reportDownloadBtn = document.getElementById('report-download-btn');
  if(reportDownloadBtn) reportDownloadBtn.onclick = downloadReport;
  app.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>shiftMonth(parseInt(b.dataset.shift)));
  const monthNameSel = document.getElementById('month-select-name');
  const monthYearSel = document.getElementById('month-select-year');
  const applyMonthYear = ()=>{
    const mSel = document.getElementById('month-select-name');
    const ySel = document.getElementById('month-select-year');
    if(!mSel || !ySel) return;
    state.month = `${ySel.value}-${pad2(parseInt(mSel.value))}`;
    state.selectedTxIds = [];
    ensureRecurringForMonth(state.month);
    render();
  };
  if(monthNameSel) monthNameSel.onchange = applyMonthYear;
  if(monthYearSel) monthYearSel.onchange = applyMonthYear;
  const categoryFilterSel = document.getElementById('category-filter');
  if(categoryFilterSel) categoryFilterSel.onchange = e=>{state.categoryFilter=e.target.value; render();};
  const notesArea = document.getElementById('notes-area');
  if(notesArea) notesArea.oninput = e=>scheduleSaveNotes(e.target.value);
  app.querySelectorAll('.tx-select-check').forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = ()=>{
      const id = cb.dataset.txid;
      if(cb.checked){ if(!state.selectedTxIds.includes(id)) state.selectedTxIds.push(id); }
      else { state.selectedTxIds = state.selectedTxIds.filter(x=>x!==id); }
      render();
    };
  });
  const selectAllCheck = document.getElementById('select-all-check');
  if(selectAllCheck){
    selectAllCheck.onclick = e=>e.stopPropagation();
    selectAllCheck.onchange = ()=>{
      const visibleIds = Array.from(app.querySelectorAll('.tx-select-check')).map(cb=>cb.dataset.txid);
      if(selectAllCheck.checked){
        state.selectedTxIds = Array.from(new Set([...state.selectedTxIds, ...visibleIds]));
      } else {
        const toRemove = new Set(visibleIds);
        state.selectedTxIds = state.selectedTxIds.filter(id=>!toRemove.has(id));
      }
      render();
    };
  }
  const bulkReplicateBtn = document.getElementById('bulk-replicate-btn');
  if(bulkReplicateBtn) bulkReplicateBtn.onclick = ()=>openReplicateForm([...state.selectedTxIds]);
  const clearSelectionBtn = document.getElementById('clear-selection-btn');
  if(clearSelectionBtn) clearSelectionBtn.onclick = ()=>{state.selectedTxIds=[]; render();};
  const clearBtn = document.getElementById('clear-examples');
  if(clearBtn) clearBtn.onclick = clearExamples;

  const openBtn = document.getElementById('open-form-btn');
  if(openBtn) openBtn.onclick = openForm;
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.onclick = ()=>{state.showForm=false;state.editingId=null;render();};
  const closeBtn = document.getElementById('close-form-btn');
  if(closeBtn) closeBtn.onclick = ()=>{state.showForm=false;state.editingId=null;render();};
  app.querySelectorAll('.type-btn').forEach(b=>b.onclick=()=>{
    const ty=b.dataset.type;

    state.form.category = catsFor(ty)[0];
    render();
  });
  app.querySelectorAll('.nat-btn').forEach(b=>b.onclick=()=>{state.form.nature=b.dataset.nat;render();});
  const fDesc=document.getElementById('f-desc'), fValue=document.getElementById('f-value'),
        fDate=document.getElementById('f-date'), fCat=document.getElementById('f-category');
  if(fDesc) fDesc.oninput=e=>state.form.desc=e.target.value;

  if(fDate) fDate.oninput=e=>state.form.date=e.target.value;
  if(fCat) fCat.onchange=e=>state.form.category=e.target.value;
  const submitBtn = document.getElementById('submit-form-btn');
  if(submitBtn) submitBtn.onclick = submitForm;
  const deleteBtn = document.getElementById('delete-form-btn');
  if(deleteBtn) deleteBtn.onclick = deleteFromForm;
  const replicateFormBtn = document.getElementById('replicate-form-btn');
  if(replicateFormBtn) replicateFormBtn.onclick = ()=>{
    const id = state.editingId;
    state.showForm = false;
    state.editingId = null;
    openReplicateForm(id);
  };
  app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();removeTx(b.dataset.remove);});
  app.querySelectorAll('[data-replicate]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openReplicateForm(b.dataset.replicate);});
  app.querySelectorAll('[data-edit]').forEach(row=>row.onclick=()=>{
    const tx = state.transactions.find(t=>t.id===row.dataset.edit);
    if(tx) openEditForm(tx);
  });

  // Settings subtabs
  app.querySelectorAll('.subtab-btn').forEach(b=>b.onclick=()=>{state.settingsSubtab=b.dataset.subtab;render();});
  const saveBudgetsBtn = document.getElementById('save-budgets-btn');
  if(saveBudgetsBtn) saveBudgetsBtn.onclick = saveBudgets;
  const saveSalaryBtn = document.getElementById('save-salary-btn');
  if(saveSalaryBtn) saveSalaryBtn.onclick = saveSalary;
  const addRecBtn = document.getElementById('add-rec-btn');
  if(addRecBtn) addRecBtn.onclick = openRecForm;
  app.querySelectorAll('[data-remove-rec]').forEach(b=>b.onclick=()=>removeRecurring(b.dataset.removeRec));
  const newCatInput = document.getElementById('new-cat-name');
  if(newCatInput){
    newCatInput.oninput = e=>{state.newCatName=e.target.value;};
    newCatInput.onkeydown = e=>{ if(e.key==='Enter') addCategory('despesa'); };
  }
  const addCatDespesaBtn = document.getElementById('add-cat-despesa-btn');
  if(addCatDespesaBtn) addCatDespesaBtn.onclick = ()=>addCategory('despesa');
  const addCatReceitaBtn = document.getElementById('add-cat-receita-btn');
  if(addCatReceitaBtn) addCatReceitaBtn.onclick = ()=>addCategory('receita');
  app.querySelectorAll('[data-remove-cat]').forEach(b=>b.onclick=()=>{
    const [type,name] = b.dataset.removeCat.split('::');
    removeCategory(type,name);
  });

  // Recurring form
  const recOverlay = document.getElementById('rec-overlay');
  if(recOverlay) recOverlay.onclick = ()=>{state.showRecForm=false;render();};
  const closeRecBtn = document.getElementById('close-rec-btn');
  if(closeRecBtn) closeRecBtn.onclick = ()=>{state.showRecForm=false;render();};
  app.querySelectorAll('.rtype-btn').forEach(b=>b.onclick=()=>{
    const ty=b.dataset.rtype;
    state.recForm.type=ty;
    state.recForm.category = catsFor(ty)[0];
    render();
  });
  app.querySelectorAll('.rnat-btn').forEach(b=>b.onclick=()=>{state.recForm.nature=b.dataset.rnat;render();});
  const rfDesc=document.getElementById('rf-desc'), rfValue=document.getElementById('rf-value'),
        rfDay=document.getElementById('rf-day'), rfCat=document.getElementById('rf-category');
  if(rfDesc) rfDesc.oninput=e=>state.recForm.desc=e.target.value;
  if(rfValue) rfValue.oninput=e=>state.recForm.value=e.target.value;
  if(rfDay) rfDay.oninput=e=>state.recForm.day=e.target.value;
  if(rfCat) rfCat.onchange=e=>state.recForm.category=e.target.value;
  const submitRecBtn = document.getElementById('submit-rec-btn');
  if(submitRecBtn) submitRecBtn.onclick = submitRecForm;

  // Replicate form
  const replicateOverlay = document.getElementById('replicate-overlay');
  if(replicateOverlay) replicateOverlay.onclick = ()=>{state.showReplicateForm=false;state.replicateForIds=null;render();};
  const closeReplicateBtn = document.getElementById('close-replicate-btn');
  if(closeReplicateBtn) closeReplicateBtn.onclick = ()=>{state.showReplicateForm=false;state.replicateForIds=null;render();};
  app.querySelectorAll('.replicate-month-check').forEach(cb=>cb.onchange=()=>{state.replicateSelected[cb.dataset.month]=cb.checked;});
  const submitReplicateBtn = document.getElementById('submit-replicate-btn');
  if(submitReplicateBtn) submitReplicateBtn.onclick = submitReplicate;
}

async function boot(){
  const app = document.getElementById('app');
  if(app) app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--inkSoft);font-family:Inter,sans-serif;">Carregando seus dados…</div>';
  await loadData();
  ensureRecurringForMonth(state.month);
  render();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      // Verifica por uma versão nova sempre que o app é aberto
      reg.update();
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'activated'){
            // Uma versão nova do app já está pronta: recarrega para usá-la
            window.location.reload();
          }
        });
      });
    }).catch(e=>console.error('SW registration failed:', e));
  });
}
</script>
</body>
</html>
